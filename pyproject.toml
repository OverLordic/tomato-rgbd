[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tomato-rgbd"
version = "0.1.0"
description = "RGB-D dwarf tomato trait estimation with the official WUR RMSRE"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "opencv-python-headless>=4.10,<5", "pandas>=2.2,<4", "scikit-learn>=1.5,<2"]

[tool.setuptools.packages.find]
where = ["src"]
